services:
  qwen-flash-next:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: qwen-flash-next
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # Persist downloaded GGUF files/cache between container recreations.
      - ./models:/models

    environment:
      # Persist llama.cpp Hugging Face/model cache.
      LLAMA_CACHE: /models/cache

      # ------------------------------------------------------------
      # MODEL
      # ------------------------------------------------------------

      # TEST 3:
      # ~93.7 GB dynamic IQ4 quantization.
      LLAMA_ARG_HF_REPO: "unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ4_XS"

      LLAMA_ARG_ALIAS: "qwen3.8-flash-next"

      # Text-only benchmark.
      # Prevent llama.cpp from automatically loading the ~vision/mmproj
      # component and consuming additional VRAM.
      LLAMA_ARG_MMPROJ_AUTO: "false"

      # ------------------------------------------------------------
      # SERVER
      # ------------------------------------------------------------

      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"

      # Restore single-request mode so this can be compared directly
      # against our ~18.7 tok/s Q4_K_M baseline.
      LLAMA_ARG_N_PARALLEL: "1"

      # Keep the same 8K context as previous tests.
      LLAMA_ARG_CTX_SIZE: "8192"

      # ------------------------------------------------------------
      # CPU
      # ------------------------------------------------------------

      # Same Threadripper configuration as previous tests.
      LLAMA_ARG_THREADS: "48"

      # Keep all routed MoE expert weights in CPU RAM.
      LLAMA_ARG_CPU_MOE: "1"

      # Keep Qwen3.8 Flash-Next's large PLE / per-layer token
      # embedding tensors in CPU RAM.
      LLAMA_ARG_OVERRIDE_TENSOR: "per_layer_token_embd=CPU"

      # ------------------------------------------------------------
      # GPU
      # ------------------------------------------------------------

      # Allow llama.cpp to use the RTX 2070 Super for the
      # non-MoE portions that fit.
      LLAMA_ARG_N_GPU_LAYERS: "auto"

      # These are retained from the earlier configuration.
      # Note: because we explicitly override tensor placement,
      # llama.cpp's automatic fitter may report that it cannot
      # fully adjust placement. That is expected.
      LLAMA_ARG_FIT: "on"
      LLAMA_ARG_FIT_TARGET: "1536"

      # ------------------------------------------------------------
      # KV CACHE
      # ------------------------------------------------------------

      LLAMA_ARG_CACHE_TYPE_K: "q8_0"
      LLAMA_ARG_CACHE_TYPE_V: "q8_0"

      # ------------------------------------------------------------
      # PERFORMANCE / OBSERVABILITY
      # ------------------------------------------------------------

      LLAMA_ARG_FLASH_ATTN: "auto"
      LLAMA_ARG_ENDPOINT_METRICS: "1"
      LLAMA_ARG_PERF: "1"

    gpus: all