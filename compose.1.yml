services:
  qwen-flash-next:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: qwen-flash-next
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # Persist the ~163 GB model download
      - ./models:/models

    environment:
      # Persist llama.cpp's HF/model cache in the mounted volume
      LLAMA_CACHE: /models/cache

      # Official upstream GGUF
      LLAMA_ARG_HF_REPO: "ggml-org/Qwen3.8-Flash-Next-GGUF:Q8_0"

      # Server
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_ALIAS: "qwen3.8-flash-next"

      # Start conservatively
      LLAMA_ARG_CTX_SIZE: "8192"
      LLAMA_ARG_N_PARALLEL: "1"

      # Threadripper
      LLAMA_ARG_THREADS: "48"

      # Hybrid CPU/GPU placement
      #
      # Keep the huge routed-expert bank in system RAM.
      LLAMA_ARG_CPU_MOE: "1"

      # Let llama.cpp use the GPU for whatever remaining layers fit.
      LLAMA_ARG_N_GPU_LAYERS: "auto"

      # Keep Qwen's huge per-layer PLE/n-gram embedding data in RAM.
      LLAMA_ARG_OVERRIDE_TENSOR: "per_layer_token_embd=CPU"

      # Leave headroom because this GPU also drives the display.
      LLAMA_ARG_FIT: "on"
      LLAMA_ARG_FIT_TARGET: "1536"

      # Keep context memory under control.
      LLAMA_ARG_CACHE_TYPE_K: "q8_0"
      LLAMA_ARG_CACHE_TYPE_V: "q8_0"

      LLAMA_ARG_FLASH_ATTN: "auto"
      LLAMA_ARG_ENDPOINT_METRICS: "1"
      LLAMA_ARG_PERF: "1"

    gpus: all